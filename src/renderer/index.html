<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data: blob: glass-asset:; connect-src 'self' blob:; style-src 'self' 'unsafe-inline'; script-src 'self'"
    />
    <link rel="icon" href="./favicon.ico" />
    <title>GlassButterfly</title>
  </head>
  <body>
    <!-- Refraction filter for the glass. Static and offscreen; referenced by
         backdrop-filter in GlassCard. Kept extremely subtle (small displacement). -->
    <svg class="glass-defs" aria-hidden="true" width="0" height="0" focusable="false">
      <filter id="glass-refract" x="-15%" y="-15%" width="130%" height="130%" color-interpolation-filters="sRGB">
        <feTurbulence type="fractalNoise" baseFrequency="0.010 0.013" numOctaves="2" seed="11" result="noise" />
        <feDisplacementMap in="SourceGraphic" in2="noise" scale="8" xChannelSelector="R" yChannelSelector="G" />
      </filter>
    </svg>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
