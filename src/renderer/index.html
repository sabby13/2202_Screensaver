<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data: blob: glass-asset:; connect-src 'self' blob:; style-src 'self' 'unsafe-inline'; script-src 'self'"
    />
    <link rel="icon" href="./favicon.ico" />
    <title>GlassButterfly</title>
  </head>
  <body>
    <!-- Liquid-glass distortion filter, referenced (via inline style, so the
         #fragment resolves against this document) by .glass-card__distort. The
         noise field is computed once (static feTurbulence) and only *slid* via an
         animated feOffset, so the ripple flows smoothly without the cost of
         re-generating turbulence every frame. -->
    <svg class="glass-defs" aria-hidden="true" width="0" height="0" focusable="false">
      <filter id="glass-liquid" x="-15%" y="-15%" width="130%" height="130%" color-interpolation-filters="sRGB">
        <feTurbulence type="fractalNoise" baseFrequency="0.010 0.014" numOctaves="2" seed="7" result="noise" />
        <!-- dx and dy orbit 90 degrees out of phase, so the noise field drifts in
             a smooth circle: continuous flowing motion, seamless loop, no harsh
             reversal. Same dur on both keeps the orbit circular. -->
        <feOffset in="noise" result="noiseMoved" dx="0" dy="90">
          <animate attributeName="dx" dur="30s" repeatCount="indefinite"
                   values="0;90;0;-90;0" keyTimes="0;0.25;0.5;0.75;1" />
          <animate attributeName="dy" dur="30s" repeatCount="indefinite"
                   values="90;0;-90;0;90" keyTimes="0;0.25;0.5;0.75;1" />
        </feOffset>
        <feDisplacementMap in="SourceGraphic" in2="noiseMoved" scale="26"
                           xChannelSelector="R" yChannelSelector="G" />
      </filter>
      <!-- Gentler variant for small cards (the date): a much smaller displacement
           and drift radius, so the ripple is a proportional, subtle motion rather
           than a large, glitchy warp of a tiny surface. -->
      <filter id="glass-liquid-soft" x="-15%" y="-15%" width="130%" height="130%" color-interpolation-filters="sRGB">
        <feTurbulence type="fractalNoise" baseFrequency="0.010 0.014" numOctaves="2" seed="7" result="noise" />
        <feOffset in="noise" result="noiseMoved" dx="0" dy="28">
          <animate attributeName="dx" dur="34s" repeatCount="indefinite"
                   values="0;28;0;-28;0" keyTimes="0;0.25;0.5;0.75;1" />
          <animate attributeName="dy" dur="34s" repeatCount="indefinite"
                   values="28;0;-28;0;28" keyTimes="0;0.25;0.5;0.75;1" />
        </feOffset>
        <feDisplacementMap in="SourceGraphic" in2="noiseMoved" scale="9"
                           xChannelSelector="R" yChannelSelector="G" />
      </filter>
    </svg>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
